name = "bernstein"
version = "0.1.0"
keywords = ["math", "probability", "concentration"]
defaultTargets = ["BernsteinLean", "BernsteinLeanTest"]
testDriver = "BernsteinLeanTest"

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
maxSynthPendingDepth = 3
warningAsError = true
weak.linter.mathlibStandardSet = true
weak.linter.style.header.license = "Released under MIT license as described in the file LICENSE."

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# Public library: Bernstein's inequality for sums of independent real random variables.
[[lean_lib]]
name = "BernsteinLean"

# Test target is excluded from the public root import.
[[lean_lib]]
name = "BernsteinLeanTest"
